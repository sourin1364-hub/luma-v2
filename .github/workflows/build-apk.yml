name: Build & Release Android APK (LUMA v2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets for Capacitor (Relative Paths)
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Initialize & Sync Capacitor Android
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "LUMA" "ir.lumeraworld.luma" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Build Standalone Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../LUMA-v2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-v2-apk
          path: ./LUMA-v2.apk

      - name: Publish Direct Download Link to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LUMA v2 - نسخه اندروید (دانلود مستقیم APK)"
          body: "نسخه کامل اندروید اپلیکیشن لوما (شامل تمامی کارت‌های جدید تاروت با کیفیت بالا). برای نصب روی گوشی، فایل LUMA-v2.apk زیر را دانلود کنید."
          files: ./LUMA-v2.apk
          prerelease: false
